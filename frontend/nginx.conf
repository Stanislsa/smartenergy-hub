# Front servi par nginx (docker compose --profile all).
# Mêmes routes que le proxy de Vite (vite.config.js), pour que le front marche de la même façon en Docker.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Analytics (8083) : authentification, capteurs, mesures, analyses, résumés quotidiens
    location /api/ {
        proxy_pass http://analytics-service:8083;
    }

    # Service IA (8085) : /ai/api/v1/... -> /api/v1/...
    location /ai/ {
        proxy_pass http://ai-service:8085/;
    }

    # Contrôles de santé : /svc/<service>/health -> /health
    location /svc/collector/ {
        proxy_pass http://collector-service:8081/;
    }
    location /svc/storage/ {
        proxy_pass http://storage-service:8082/;
    }
    location /svc/analytics/ {
        proxy_pass http://analytics-service:8083/;
    }
    location /svc/ai/ {
        proxy_pass http://ai-service:8085/;
    }

    # Fichiers statiques versionnés par Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application React (routes côté navigateur)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
