# Application
spring.application.name=analytics-service
server.port=8083

# MongoDB configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27018
spring.data.mongodb.database=smartenergy

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6380

# Cassandra configuration
spring.cassandra.keyspace-name=smartenergy
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1

# Crée les index déclarés avec @Indexed (désactivé par défaut)
spring.data.mongodb.auto-index-creation=true

# Source des mesures pour l'Analytics : cassandra (mesures réelles) ou demo (données simulées)
analytics.measurement-source=cassandra

# Monitoring (Étape 11) : santé détaillée (MongoDB, Cassandra, Redis) et métriques
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
